<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>雪原英雄メーカー</title><style>
*{box-sizing:border-box}body{margin:0;background:#101e32;color:white;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}.app{max-width:460px;min-height:100dvh;margin:auto;position:relative;overflow:hidden;background:linear-gradient(165deg,#386c9b 0%,#80b5d3 29%,#4878a6 60%,#172e54 88%)}.app:before{content:'';position:absolute;inset:15% -20% 18%;background:radial-gradient(ellipse,#e4f5ff88,transparent 60%);pointer-events:none}.mountains{position:absolute;inset:25% 0 27%;opacity:.4;background:linear-gradient(135deg,transparent 43%,#244b69 44% 57%,transparent 58%) 5% 85%/145px 180px repeat-x;pointer-events:none}.top{position:relative;display:flex;align-items:center;justify-content:space-between;padding:14px 15px 6px;text-shadow:0 2px 2px #153a5e}.back{font-size:29px;cursor:pointer}.top strong{font-size:20px}.sub{font-size:11px;color:#ffdf76}.setup{position:relative;z-index:3;display:flex;gap:7px;padding:5px 12px}.setup input{width:100%;min-width:0;border:2px solid #9bc8e6;border-radius:9px;background:#e9f5ff;color:#1a3652;padding:11px;font-size:16px}.setup button,.primary{border:2px solid #1b568f;border-radius:9px;color:white;font-weight:800;background:linear-gradient(#65c3ff,#1671d3);box-shadow:0 3px 0 #0b3966;padding:9px 12px;white-space:nowrap}.rarity{position:absolute;top:115px;left:14px;font-size:35px;font-weight:1000;color:#ffdb53;text-shadow:2px 3px #a66c21}.hero-zone{position:relative;height:385px;display:flex;align-items:center;justify-content:center}.figure{position:relative;width:210px;height:305px;filter:drop-shadow(0 13px 8px #102c5270);transform:translateY(12px)}.head{position:absolute;z-index:3;width:76px;height:85px;left:68px;top:43px;background:var(--skin);border-radius:40% 40% 48% 48%;border:5px solid #2c3848}.hair{position:absolute;z-index:4;left:62px;top:31px;width:89px;height:47px;background:var(--hair);border-radius:50% 50% 25% 25%;clip-path:polygon(0 5%,100% 0,95% 85%,77% 60%,56% 96%,30% 65%,10% 100%)}.eyes{position:absolute;z-index:5;top:92px;left:88px;font-size:12px;color:#172a3a;letter-spacing:14px}.body{position:absolute;z-index:2;left:34px;top:117px;width:143px;height:135px;background:var(--coat);border:9px solid #24364a;border-radius:30% 30% 19% 19%;box-shadow:inset 0 -20px #17293b88}.body:after{content:'◆';position:absolute;left:54px;top:22px;color:var(--trim);font-size:28px}.arm{position:absolute;z-index:1;top:135px;width:50px;height:115px;border-radius:26px;background:var(--coat);border:8px solid #24364a}.arm.left{left:5px;transform:rotate(20deg)}.arm.right{right:5px;transform:rotate(-20deg)}.leg{position:absolute;top:231px;width:56px;height:72px;background:#273346;border:7px solid #192b3d;border-radius:12px 12px 18px 18px}.leg.left{left:43px}.leg.right{right:43px}.weapon{position:absolute;z-index:4;right:-13px;top:-3px;width:15px;height:292px;border-radius:9px;background:linear-gradient(90deg,#634224,#e1bb7b,#5b3b23);transform:rotate(15deg);box-shadow:0 0 0 3px #243343}.weapon:before{content:'';position:absolute;top:-24px;left:-16px;width:46px;height:65px;background:var(--trim);clip-path:polygon(50% 0,100% 60%,65% 100%,35% 100%,0 60%)}.weapon.bow{width:7px;height:255px;border-radius:50%;background:#754f2d;transform:rotate(-12deg);border:3px solid #edcf9c}.weapon.bow:before{content:'⌒';background:none;clip-path:none;top:-38px;left:-48px;font-size:115px;color:#d4af65}.weapon.shield:before{content:'⬟';clip-path:none;background:none;left:-27px;top:72px;font-size:64px;color:#b7d4df;text-shadow:2px 3px #3a5b77}.power{position:relative;text-align:center;font-size:19px;color:#fff1da;font-weight:900;text-shadow:0 2px 3px #101e32}.stars{text-align:center;color:#55f5ed;font-size:31px;letter-spacing:5px;margin-top:12px;text-shadow:0 2px #15586c}.info{position:relative;display:flex;justify-content:space-around;margin:12px 16px;padding:8px 0;background:#1939588a;border-radius:8px;text-align:center}.info small{display:block;color:#b8d3e8;font-size:11px}.info b{font-size:20px}.pane{position:relative;min-height:188px;margin:10px 14px 0;padding:13px 12px;background:#18375873;border-radius:8px}.pane h3{margin:0 0 8px;font-size:15px}.pane p{font-size:13px;line-height:1.7;margin:7px 0}.tabs{position:relative;display:flex;gap:2px;margin:18px 8px 0}.tabs button{flex:1;padding:15px 4px;border:1px solid #7eadd3;border-radius:10px 10px 0 0;background:#4c8cc3;color:white;font-weight:700}.tabs button.active{background:#e4f3f6;color:#263c51}.skillgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}.skill{border:2px solid #7ea8ce;border-radius:10px;background:#1d486c;padding:8px 3px;color:white;text-align:center}.skill.active{border-color:#ffd65d;box-shadow:0 0 9px #f9d16c}.skill .ico{font-size:29px;display:block}.skill small{font-size:10px}.tag{display:inline-block;font-size:11px;color:#aee7ff;margin:3px 0}.detail{background:#0b284a80;padding:10px;border-radius:7px}.equipment{display:flex;align-items:center;gap:14px}.eqicon{font-size:53px;background:linear-gradient(135deg,#b35b1c,#ffc667);border:3px solid #ffe19c;border-radius:12px;padding:10px}.muted{color:#c4d9e8}.footer{position:relative;text-align:center;font-size:11px;color:#b6d3e8;padding:12px 0 20px}.share{margin:10px 14px 0;width:calc(100% - 28px)}
</style></head><body><main class="app" id="app"><div class="mountains"></div><header class="top"><span class="back">❮</span><strong id="heading">雪原の英雄 <span class="sub">S1</span></strong><span>▣</span></header><div class="setup"><input id="name" maxlength="24" placeholder="英雄にする名前を入力" value="ミルク"><button id="generate">英雄生成</button></div><div class="rarity" id="rarity">SSR</div><section class="hero-zone"><div class="figure" id="figure"><div class="weapon" id="weapon"></div><div class="arm left"></div><div class="arm right"></div><div class="leg left"></div><div class="leg right"></div><div class="body"></div><div class="head"></div><div class="hair"></div><div class="eyes">• •</div></div></section><div class="power" id="power"></div><div class="stars" id="stars">✦ ✦ ✦ ✦ ✦</div><div class="info"><div><small>兵種</small><b id="troop"></b></div><div><small>レベル</small><b>80</b></div><div><small>部隊容量</small><b id="capacity"></b></div></div><section class="pane" id="pane"></section><nav class="tabs"><button class="active" data-tab="stats">ステータス</button><button data-tab="skills">スキル</button><button data-tab="equip">専用装備</button></nav><button class="primary share" id="copy">英雄情報をコピー</button><div class="footer">非公式ファン制作・ゲーム内の英雄や効果とは無関係です</div></main><script>
const $=id=>document.getElementById(id);let hero,tab='stats',selected=0;
function hash(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
const pick=(a,n)=>a[n%a.length];const pct=n=>n.toFixed(1).replace(/\.0$/,'')+'%';
function makeHero(name){const h=hash(name),type=h%3,rarity=pick(['SSR','SSR','SSR','SR'],Math.floor(h/7)),attack=18+(h%9),damage=15+(h%11),reduce=12+(h%9),hp=16+(h%10),names=['不屈の誓約','氷原の猛攻','極寒の射撃'],types=['盾兵','槍兵','弓兵'];const skill=[{icon:'⚔️',title:pick(['凍刃連撃','雪嵐の一閃','氷結衝撃'],h>>3),kind:'探検',desc:`前方範囲内の敵に攻撃力の${240+h%91}%のダメージを与える。クールダウン：12秒。`,levels:[180,200,220,240,260].map(v=>v+h%31)+'%'},{icon:'❄️',title:'寒気の追撃',kind:'探検',desc:`通常攻撃時、${20+h%16}%の確率で対象に攻撃力の${120+h%81}%の追加ダメージを与える。`,levels:['12%','16%','20%','24%','30%']},{icon:'🛡️',title:'雪原の守護',kind:'探検',desc:`自身が受けるダメージを${10+h%11}%減少させる。効果は5秒間持続する。クールダウン：15秒。`,levels:['6%','9%','12%','15%','20%']},{icon:'🏹',title:names[type],kind:'遠征',desc:`味方${types[type]}の${type===0?'HP':type===1?'殺傷力':'攻撃力'}が${pct(attack)}上昇する。`,levels:[5,10,15,20,attack].map(pct)},{icon:'🔥',title:'士気高揚',kind:'遠征',desc:`味方全部隊の与ダメージが${pct(damage)}上昇する。`,levels:[4,8,12,16,damage].map(pct)},{icon:'🌨️',title:'氷壁戦術',kind:'遠征',desc:`味方全部隊が受けるダメージが${pct(reduce)}減少する。`,levels:[3,6,9,12,reduce].map(pct)}];return {name,h,type,rarity,skill,power:(7800000+h%2200000).toLocaleString(),capacity:(12500+h%1800).toLocaleString(),equip:pick(['霜月の長弓','氷晶の戦斧','白銀の長槍','凍土の護符','極夜の剣'],h>>6),hp}}
function draw(){const h=hero;document.documentElement.style.setProperty('--skin',pick(['#f4c39e','#b98768','#d9a786','#f0d0b7'],h.h>>5));document.documentElement.style.setProperty('--hair',pick(['#342c33','#f5e2a4','#b7d5e2','#793d31','#4e6084'],h.h>>9));document.documentElement.style.setProperty('--coat',pick(['#283b57','#673f42','#496b5b','#6b5784','#5b4a39'],h.h>>12));document.documentElement.style.setProperty('--trim',pick(['#e4be64','#80e4f2','#ed8e78'],h.h>>17));$('heading').innerHTML=h.name.replaceAll('&','&amp;').replaceAll('<','&lt;')+' <span class="sub">S'+(1+h.h%10)+'</span>';$('rarity').textContent=h.rarity;$('power').textContent='⚔ '+h.power;$('troop').textContent=['🛡️ 盾','⚔️ 槍','🏹 弓'][h.type];$('capacity').textContent=h.capacity;$('weapon').className='weapon '+['shield','','bow'][h.type];document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let pane=$('pane');if(tab==='stats'){pane.innerHTML=`<h3>英雄ステータス</h3><p>英雄タイプ：戦闘型　｜　レアリティ：${h.rarity}</p><p>英雄攻撃力：${(780+h.h%330).toLocaleString()}　　英雄防御力：${(640+h.h%250).toLocaleString()}</p><p>英雄HP：${(14000+h.h%4500).toLocaleString()}</p><p>兵種特性：${['盾兵の前線維持','槍兵の突破攻撃','弓兵の遠距離攻撃'][h.type]}</p><p class="muted">名前から固定生成される架空の英雄です。</p>`}else if(tab==='skills'){pane.innerHTML=`<h3>英雄スキル</h3><div class="skillgrid">${h.skill.map((s,i)=>`<button class="skill ${i===selected?'active':''}" data-skill="${i}"><span class="ico">${s.icon}</span><small>${s.kind} Lv.5</small></button>`).join('')}</div><div class="detail"><span class="tag">${h.skill[selected].kind}スキル · Lv.5</span><h3>${h.skill[selected].title}</h3><p>${h.skill[selected].desc}</p><p class="muted">レベルアッププレビュー：${h.skill[selected].levels.join(' / ')}</p></div>`;pane.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>{selected=+b.dataset.skill;draw()})}else{pane.innerHTML=`<h3>専用装備</h3><div class="equipment"><div class="eqicon">${['🛡️','🗡️','🏹'][h.type]}</div><div><b>${h.equip}</b><p class="muted">専用装備 · Lv.10</p><p>英雄攻撃力 +${pct(20+h.h%11)}</p></div></div><div class="detail"><h3>専用スキル：極地の指揮</h3><p>遠征時、味方全部隊の${['HP','殺傷力','攻撃力'][h.type]}が${pct(10+h.h%7)}上昇する。</p><p class="muted">専用装備の効果は架空の設定です。</p></div>`}}
function generate(){const name=$('name').value.trim();if(!name){alert('名前を入力してね');return}hero=makeHero(name);selected=0;tab='stats';draw()}
$('generate').onclick=generate;$('name').onkeydown=e=>{if(e.key==='Enter')generate()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;draw()});$('copy').onclick=async()=>{let s=`【雪原英雄メーカー】\n${hero.name}（${hero.rarity} / ${['盾兵','槍兵','弓兵'][hero.type]}）\n戦力：${hero.power}\n専用装備：${hero.equip}\n`+hero.skill.map(x=>`${x.kind}・${x.title}：${x.desc}`).join('\n');try{await navigator.clipboard.writeText(s);$('copy').textContent='コピーしました！';setTimeout(()=>$('copy').textContent='英雄情報をコピー',1700)}catch{prompt('コピーしてください',s)}};generate();
</script></body></html>
